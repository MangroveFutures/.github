# Org-wide issue forms (source: MangroveFutures/home/org-dotgithub; copied to .github automatically).
# Blank issues stay allowed on purpose: capture is cheap and ungated (ORG-0006, RFC-0005 §2). A blank
# capture should carry the `needs-grooming` (or `spike`) label; the forms are for groomed work.
# Why still true after the Capture form: ORG-0006 says a bare capture is free, and this flag only changes
# the web chooser (the API, `gh` and the MCP tool ignore it). Closing it would hide the free path from
# people without making agents any more careful; the agent-path hook is what moves context upstream.
blank_issues_enabled: true
contact_links:
  - name: The org handbook
    url: https://github.com/MangroveFutures/home
    about: Where decisions, the repo map and the working agreement live.
  - name: The roadmap (org Project)
    url: https://github.com/orgs/MangroveFutures/projects/2
    about: Every open piece of work across all repos.
