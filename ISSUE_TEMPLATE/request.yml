  attributes:
    value: 'One front door for any proposal or request: an RFC, spend, access, new work, or feedback. Pick the type; its owner
      triages it.


      - **Proposal** (proposal): triaged by Doug, with Codd, Baye. Rosie decides: to accept.

      - **Spend** (spend): triaged by Lynn, with Yad, Bill. Rosie decides: always (red tier).

      - **Access** (access): triaged by Baye, with Grace. Rosie decides: for secrets, org-wide permissions and anything outward.

      - **New work** (work): triaged by Doug. Rosie decides: only if red tier.

      - **Feedback** (feedback): triaged by Seddon, with Feynman. Rosie decides: no.'
