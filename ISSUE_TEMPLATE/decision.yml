# Issue form: Decision. Source: MangroveFutures/home org-dotgithub (ORG-0006). Follows MADR's
# required sections so the answer converts into an ADR or ORG record. Also the SPEC that
# scripts/check_issue.py reads: each `label` is a `### ` heading, `required: true` is required.
name: Decision needed
description: A choice someone has to make, with the options laid out.
labels: ["decision"]
body:
  - type: textarea
    id: question
    attributes:
      label: The question
      description: One sentence. What exactly is being decided?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context and links
      description: What led here. Pointers, not copies, each with a one-line summary. At least one link is required.
    validations:
      required: true
  - type: textarea
    id: drivers
    attributes:
      label: What matters in choosing
      description: The decision drivers.
  - type: textarea
    id: options
    attributes:
      label: Options
      description: Each option with its pros and cons. Mark the recommended one and say why.
    validations:
      required: true
  - type: textarea
    id: blocked
    attributes:
      label: What is blocked on this
      description: What cannot go ahead until this is decided. "Nothing yet" is a valid answer.
    validations:
      required: true
  - type: input
    id: by
    attributes:
      label: Decide by
      description: A date (for example 31 Oct 2026) or "no deadline".
  - type: dropdown
    id: why_hers
    attributes:
      label: why_hers
      description: >-
        Why is this Rosie's to decide? Pick the one ORG-0028 reason, or "none: the owner decides". The plate (handbook/reference/the-plate.md)
        shows her only items with a reason; an item with none goes to its owner agent. Optional for now (22 Nov 2026), proposed required
        for `needs-rosie` items once the plate has run for a week.
      options:
        - changes_agreed_concept
        - cannot_be_undone
        - spends_beyond_budget
        - needs_her_secret_or_login
        - her_own_action
        - "none: the owner decides"
  - type: textarea
    id: outcome
    attributes:
      label: Decision outcome
      description: Leave empty until decided; then link the ADR or ORG record.
  - type: textarea
    id: next_action
    attributes:
      label: Next action when decided
      description: Fill when the decision is made, and before closing. Link the issue or pull request that carries it out, or write "none, because ..." with the reason. A decision with no next action is not finished (a check comments when one is closed without it).
