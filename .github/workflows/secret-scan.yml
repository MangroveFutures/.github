# Secret scan (reusable): looks for passwords, keys and tokens in the code and in the git history.
# ONE copy for every MangroveFutures repo (Rosie, 23 Oct 2026: "one reusable workflow"). A repo calls it
# with a ~15-line caller, `uses: MangroveFutures/.github/.github/workflows/secret-scan.yml@main`.
# Source: org-dotgithub/.github/workflows/secret-scan.yml in MangroveFutures/home; copied to
# MangroveFutures/.github automatically (ORG-0001). Never edit the .github repo by hand.
#
# Tool: gitleaks (MIT licence) 8.30.1, the released binary, checked against a SHA-256 below. Not the
# gitleaks GitHub Action: it needs a licence key for organisation accounts. Decision record:
# handbook/reference/intake-secret-scanner-2026-10-23.md in home (ORG-0008). The same scan runs by hand
# with home's scripts/secret_scan.sh, which never writes into the repo it scans.
#
# Inputs:
#   mode    auto (default): a pull request scans only its new commits, everything else scans the full
#           history; "full": always the full history; "diff": always the new commits of a pull request.
#   config  path to the repo's own gitleaks config (default .gitleaks.toml). If the file does not exist,
#           gitleaks' default rules run with no allowlist.
# --redact=100 and a report file: no secret value ever reaches a log; the summary prints only the rule
# name, the file, the line and the short commit. The job fails closed: a scan that breaks is a failure.
#
# ONE SETTING FOR ROSIE, only if .github is ever made private: a workflow in a private repo can be
# called by other repos only when that repo's Settings > Actions > General > Access is set to
# "Accessible from repositories in the 'MangroveFutures' organization". While .github is public (it must
# be, for the issue forms: handbook/reference/the-dotgithub-repo.md) any repo can call it and no setting
# is needed. Without it, callers fail with "workflow was not found".
# Changing this file is red tier (ORG-0005): it needs Rosie's explicit yes to merge.
name: Secret scan

on:
  workflow_call:
    inputs:
      mode:
        description: "auto, full or diff"
        type: string
        default: auto
      config:
        description: "Path to the repo's gitleaks config"
        type: string
        default: .gitleaks.toml

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's checksums file, 23 Oct 2026.
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history, so the weekly scan sees everything and a diff scan can reach its base commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned, checksum verified)
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/gl.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gl.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gl.tgz" -C "$RUNNER_TEMP" gitleaks

      - name: Scan
        env:
          EVENT: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
          CONFIG: ${{ inputs.config }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -uo pipefail
          case "$MODE" in auto|full|diff) ;; *) echo "::error::mode must be auto, full or diff, not '$MODE'"; exit 1 ;; esac
          range=""
          if [ "$MODE" != "full" ] && [ "$EVENT" = "pull_request" ]; then range="${PR_BASE}..HEAD"; fi
          if [ "$MODE" != "full" ] && [ "$EVENT" = "push" ] && ! [[ "$PUSH_BEFORE" =~ ^0*$ ]]; then range="${PUSH_BEFORE}..HEAD"; fi
          # A change must not be able to silence the check that scans it: ignore inline `gitleaks:allow`
          # comments and any .gitleaksignore file in the repo, and on a pull request read the allowlist config
          # from the BASE commit, not from the pull request's own copy.
          mkdir -p "$RUNNER_TEMP/gl-noignore"
          # Scan a bare mirror copy, not the checkout: gitleaks reads a .gitleaksignore from the working tree even
          # when told otherwise, and a bare copy has no working tree for a change to plant one in.
          git clone --mirror --no-local --quiet . "$RUNNER_TEMP/scan.git"
          args=(git "$RUNNER_TEMP/scan.git" --redact=100 --no-banner --log-level error --exit-code 2
                --ignore-gitleaks-allow --gitleaks-ignore-path "$RUNNER_TEMP/gl-noignore"
                --report-format json --report-path "$RUNNER_TEMP/report.json")
          cfgfile=""
          if [ "$EVENT" = "pull_request" ]; then
            if git cat-file -e "${PR_BASE}:${CONFIG}" 2>/dev/null; then
              git show "${PR_BASE}:${CONFIG}" > "$RUNNER_TEMP/gl-config.toml"; cfgfile="$RUNNER_TEMP/gl-config.toml"
            else echo "no $CONFIG on the base branch: default rules, no allowlist"; fi
          elif [ -f "$CONFIG" ]; then cfgfile="$CONFIG"
          else echo "no $CONFIG in this repo: default rules, no allowlist"; fi
          if [ -n "$cfgfile" ]; then args+=(--config "$cfgfile"); fi
          if [ -n "$range" ]; then args+=(--log-opts "$range"); echo "scope: commits $range"; else echo "scope: full history"; fi
          # Exit codes: 0 clean, 2 leaks found, anything else (or no report) means the scan itself broke,
          # which must fail the job and never count as clean.
          "$RUNNER_TEMP/gitleaks" "${args[@]}" >/dev/null 2>"$RUNNER_TEMP/gl-stderr.txt"; rc=$?
          # --log-level error means anything on stderr is an error (a bad commit range exits 0 but writes one).
          if { [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; } || [ -s "$RUNNER_TEMP/gl-stderr.txt" ] || [ ! -s "$RUNNER_TEMP/report.json" ]; then
            echo "::error::the secret scan itself failed (gitleaks exit $rc); this is NOT a clean result"
            head -c 600 "$RUNNER_TEMP/gl-stderr.txt"; exit 1
          fi
          python3 -I - "$RUNNER_TEMP/report.json" <<'PY'
          import json, os, sys
          rows = json.load(open(sys.argv[1])) or []
          if not rows:
              print("secret scan: clean")
              sys.exit(0)
          lines = ["## Secret scan: %d finding(s)" % len(rows), "",
                   "No secret value is shown. The way out, in this order:", "",
                   "1. **Rotate the credential at its provider first.** A secret that reached git is public until rotated.",
                   "2. Then remove it from the files, and say in the PR that it was rotated. Rewriting history is a",
                   "   separate decision (deleting history needs Rosie's yes); rotation is what makes the leak harmless.",
                   "3. Only for a **proven false positive**, add a narrow entry to the repo's gitleaks config (`.gitleaks.toml`): one rule, one file,",
                   "   with a comment saying why it is not a secret.",
                   "4. Register a real credential in `handbook/reference/credentials.yaml` in the home repo (metadata only, no value).",
                   "", "| Rule | File:line | Commit |", "|---|---|---|"]
          for r in rows:
              lines.append("| %s | %s:%s | %s |" % (r["RuleID"], r["File"], r["StartLine"], r["Commit"][:8]))
          text = "\n".join(lines)
          print(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(text + "\n")
          sys.exit(1)
          PY
