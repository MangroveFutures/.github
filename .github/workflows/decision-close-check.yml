# Reusable workflow: when an issue labelled `decision` is closed, check that it names its next action
# (a linked issue or pull request, or "none, because ..."). Source: MangroveFutures/home/org-dotgithub,
# copied to MangroveFutures/.github by sync-dotgithub.yml (ORG-0001). Rosie, 1 Nov 2026.
#
# PURPOSE: a decision closed with no next action leaves nothing happening (1 Nov 2026, four such closes).
# FAILURE MODES tested on 1 Nov 2026 (throwaway issues, home#994 and #996 to #1000), all pass after the
# fix below: false alarm when the link is in the body (#996), "none, because" (#997), not-planned close
# (#998), link given in a later comment (#999); a missed alarm when a decision is reopened and closed
# again (#1000: the check's own example line counted as a next action; fixed by ignoring its own comment).
# STAGE: shadow (comments only; never reopens or blocks).
# PROMOTE to enforcing (reopen with a comment) WHEN: five real decision closes have gone through with no
# false alarm. NOT a calendar date. It is checked by the decision-flow monitor, not by a weekly review.
# ROLL BACK: delete the caller file, or revert the pull request. Nothing else depends on this.
#
# A repo calls it with a few lines (starter: workflow-templates/decision-close-check.yml):
#
#   on:
#     issues: {types: [closed]}
#   permissions:
#     issues: write
#   jobs:
#     check:
#       uses: MangroveFutures/.github/.github/workflows/decision-close-check.yml@main
name: decision-close-check
on:
  workflow_call:
permissions:
  issues: write
jobs:
  check:
    if: contains(github.event.issue.labels.*.name, 'decision') && github.event.issue.state_reason != 'not_planned'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = context.payload.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: number, per_page: 100 });
            const mine = 'Closed without a next action';
            const text = [context.payload.issue.body || '', ...comments.filter(c => !(c.body || '').startsWith(mine)).map(c => c.body || '')].join('\n');
            const ok = /next action[^\n]{0,200}?(#\d+|[\w.-]+\/[\w.-]+#\d+|none,\s*because)/i.test(text);
            if (!ok) {
              await github.rest.issues.createComment({ owner, repo, issue_number: number, body:
                'Closed without a next action. A decision is finished when something follows from it. ' +
                'Add a line `Next action: #123` (the issue or pull request that carries it out) or `Next action: none, because ...`. ' +
                '(Shadow check, comment only; becomes enforcing after five real closes with no false alarm.)' });
            }
