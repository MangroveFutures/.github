# Checks every issue in this repo against the org work-item standard (MangroveFutures/home ORG-0006).
# The logic lives once, in MangroveFutures/.github; this file only calls it.
name: Issue standard
on:
  issues:
    # Narrowed 19 Oct 2026 (home #490): no `edited`, and `labeled` only counts for the label `ready`
    # (see the job's `if`). Every run bills at least one minute, and 135 of 493 runs in six days were
    # cancelled duplicates. The daily sweep below still re-checks every open `ready` issue.
    types: [opened, labeled, reopened]
  schedule:
    - cron: "17 6 * * *" # daily sweep of open issues labelled `ready`
  workflow_dispatch:
    inputs:
      sweep-scope:
        description: "Which open issues to check: ready (labelled ready) or all."
        type: choice
        options: [ready, all]
        default: ready
permissions:
  issues: write
concurrency:
  group: issue-standard-${{ github.event.issue.number || github.run_id }}-${{ github.event.label.name || '' }}
  cancel-in-progress: false
jobs:
  check:
    # An issue event runs the check on opened, reopened, or when the label added is `ready`.
    # Schedule and manual runs always go through.
    if: github.event_name != 'issues' || github.event.action != 'labeled' || github.event.label.name == 'ready'
    uses: MangroveFutures/.github/.github/workflows/issue-standard.yml@main
    with:
      # shadow = comment only. ORG-0006: switch to enforce only after graduation (10+ runs, Rosie's
      # spot-check, a record in docs/learnings.md).
      ready-gate: shadow
      sweep-scope: ${{ inputs.sweep-scope || 'ready' }}
